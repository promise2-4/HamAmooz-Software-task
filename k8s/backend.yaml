apiVersion: v1
kind: Namespace
metadata:
  name: hemmasian
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: hemmasian
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "app.hemmasian.osdl.ir,hemmasian,backend,backend-metrics.hemmasian.svc,localhost,127.0.0.1"
  DATABASE_PATH: "/data/db.sqlite3"
  BACKUP_ROOT: "/backups"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  APP_STATUS_CACHE_URL: "redis://redis:6379/1"
  APP_STATUS_CACHE_TTL: "60"
  PROMETHEUS_EXPORT_PORT: "9808"
  KUBERNETES_VERIFY_SSL: "true"
  KUBERNETES_CA_CERT: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
  KUBERNETES_PROTECTED_NAMESPACES: "default,kube-system,kube-public,kube-node-lease,hemmasian,memos,monitoring,monitoring-system,monitoring-hamamooz-task"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: hemmasian
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-backups
  namespace: hemmasian
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: hemmasian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        hamamooz.io/workload-node: "true"
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hemmasian
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hemmasian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        hamamooz.io/workload-node: "true"
      initContainers:
        - name: prepare-data
          image: hemmasian-backend:1.3.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "mkdir -p /data /backups && chown -R 100:101 /data /backups"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
        - name: migrate
          image: hemmasian-backend:1.3.0
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: backend
          image: hemmasian-backend:1.3.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 320Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
        - name: backups
          persistentVolumeClaim:
            claimName: backend-backups
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hemmasian
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: hemmasian
  labels:
    observability: hamamooz
spec:
  selector:
    app: backend
  ports:
    - name: metrics
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: hemmasian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      nodeSelector:
        hamamooz.io/workload-node: "true"
      containers:
        - name: celery-worker
          image: hemmasian-backend:1.3.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "worker", "--loglevel=info", "--pool=solo", "--concurrency=1"]
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 320Mi
          ports:
            - name: metrics
              containerPort: 9808
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
        - name: backups
          persistentVolumeClaim:
            claimName: backend-backups
---
apiVersion: v1
kind: Service
metadata:
  name: celery-metrics
  namespace: hemmasian
  labels:
    observability: hamamooz
spec:
  selector:
    app: celery-worker
  ports:
    - name: metrics
      port: 9808
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: hemmasian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      nodeSelector:
        hamamooz.io/workload-node: "true"
      containers:
        - name: celery-beat
          image: hemmasian-backend:1.3.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "beat", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
