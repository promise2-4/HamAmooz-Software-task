apiVersion: v1
kind: Namespace
metadata:
  name: hemmasian
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: hemmasian
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "hemmasian,backend,backend.hemmasian.svc.cluster.local,94.101.187.131,188.121.116.242"
  DATABASE_PATH: "/data/db.sqlite3"
  BACKUP_ROOT: "/backups"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  KUBERNETES_VERIFY_SSL: "false"
  KUBERNETES_PROTECTED_NAMESPACES: "default,kube-system,kube-public,kube-node-lease,hemmasian,monitoring"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: hemmasian
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-backups
  namespace: hemmasian
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: hemmasian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hemmasian
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hemmasian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: prepare-data
          image: hemmasian-backend:1.0.0
          imagePullPolicy: Never
          command: ["/bin/sh", "-c", "mkdir -p /data /backups && chown -R 100:101 /data /backups"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
        - name: migrate
          image: hemmasian-backend:1.0.0
          imagePullPolicy: Never
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: backend
          image: hemmasian-backend:1.0.0
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
        - name: backups
          persistentVolumeClaim:
            claimName: backend-backups
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hemmasian
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: hemmasian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: hemmasian-backend:1.0.0
          imagePullPolicy: Never
          command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=1"]
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
        - name: backups
          persistentVolumeClaim:
            claimName: backend-backups
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: hemmasian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: hemmasian-backend:1.0.0
          imagePullPolicy: Never
          command: ["celery", "-A", "config", "beat", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: hemmasian
spec:
  ingressClassName: traefik
  rules:
    - host: hemmasian
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
