apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: hemmasian
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: hamamooz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/part-of: hamamooz
    spec:
      nodeSelector:
        hamamooz.io/workload-node: "true"
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.80.1
          env:
            - name: REDIS_ADDR
              value: redis://redis:6379
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: hemmasian
  labels:
    observability: hamamooz
spec:
  selector:
    app: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
