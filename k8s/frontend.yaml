apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hemmasian
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: hamamooz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: hamamooz
    spec:
      nodeSelector:
        hamamooz.io/workload-node: "true"
      containers:
        - name: frontend
          image: hemmasian-frontend:1.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hemmasian
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: hamamooz
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: hemmasian
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: hamamooz
spec:
  ingressClassName: traefik
  rules:
    - host: app.hemmasian.osdl.ir
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
